<div class="title">Do you wish to delete a node?</div>

<div class="content">
  It is referenced {{ dialogData.node.referencedByPropertiesSet.size }} times
</div>

<div class="actions">
  <button (click)="close({ delete: true })"><app-icon>delete</app-icon> Delete</button>

  <button (click)="close({ delete: false })"><app-icon>cancel</app-icon> Cancel</button>
</div>
